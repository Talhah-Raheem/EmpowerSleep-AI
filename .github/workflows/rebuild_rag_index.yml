# =============================================================================
# Rebuild RAG Index — Weekly auto-sync of EmpowerSleep blog content
# =============================================================================
#
# What this does:
#   1. Scrapes all blog articles from empowersleep.com
#   2. Chunks articles and generates OpenAI embeddings
#   3. Rebuilds the FAISS index used by the backend
#   4. Commits updated rag_artifacts/ back to the repo
#
# Triggers: weekly cron (Sunday 4am UTC) + manual dispatch
# =============================================================================

name: Rebuild RAG Index

on:
  schedule:
    # Run every Sunday at 04:00 UTC (Saturday 11pm EST)
    - cron: "0 4 * * 0"

  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:

# ---------------------------------------------------------------------------
# Guard: prevent re-triggering when this workflow pushes rag_artifacts/
# The [skip ci] in the commit message tells GitHub to ignore that push.
# As a belt-and-suspenders measure, we also ignore pushes that only touch
# rag_artifacts/ so even without [skip ci] it won't retrigger.
# ---------------------------------------------------------------------------
# (path-based filtering only applies to `push` triggers, which we don't use,
#  so the [skip ci] commit message is the primary guard here.)

# ---------------------------------------------------------------------------
# Concurrency: only one rebuild can run at a time.
# If a new run is triggered while one is in progress, the new one queues
# rather than cancelling the running job (we want the rebuild to finish).
# ---------------------------------------------------------------------------
concurrency:
  group: rag-index-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest

    # Safety: kill the job if it hangs (scraping + embedding should take < 10 min)
    timeout-minutes: 20

    # Don't run on commits made by this workflow (belt-and-suspenders with [skip ci])
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      # --------------------------------------------------
      # 1. Checkout the repo
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN so pushes from this workflow
          # do NOT trigger other workflows (unlike a PAT, which would).
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 2. Set up Python (match runtime.txt)
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 3. Cache pip dependencies to speed up repeat runs
      # --------------------------------------------------
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # --------------------------------------------------
      # 4. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 5. Scrape all blog articles
      # --------------------------------------------------
      - name: Scrape blog articles
        run: python scripts/scrape_empowersleep_blog.py

      # --------------------------------------------------
      # 6. Rebuild FAISS index from scraped articles
      #    This generates embeddings via OpenAI and writes
      #    faiss.index + chunks.jsonl + build_meta.json
      # --------------------------------------------------
      - name: Rebuild FAISS index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/build_blog_index.py

      # --------------------------------------------------
      # 7. Re-ingest textbooks so they stay in the merged index
      #    The manifest ensures unchanged PDFs are skipped (idempotent)
      # --------------------------------------------------
      - name: Re-ingest textbooks
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -f "data/raw/Sleep_And_Health.pdf" ]; then
            python scripts/ingest_textbook.py \
              --pdf data/raw/Sleep_And_Health.pdf \
              --book-title "Sleep and Health"
          else
            echo "No textbook PDF found, skipping textbook ingestion"
          fi

      # --------------------------------------------------
      # 8. Re-ingest Notion content so it stays in the merged index
      #    build_blog_index.py overwrites rag_artifacts/ from scratch,
      #    so Notion must be re-added after each blog rebuild.
      # --------------------------------------------------
      - name: Re-ingest Notion content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -d "data/raw/empower_sleep_notion" ]; then
            python scripts/ingest_notion_export.py --rebuild
          else
            echo "No Notion export found, skipping Notion ingestion"
          fi

      # --------------------------------------------------
      # 9. Commit and push updated artifacts
      #    - Only commits if files actually changed (git diff)
      #    - [skip ci] prevents this push from re-triggering workflows
      #    - Uses GITHUB_TOKEN so the push does NOT trigger other workflows
      # --------------------------------------------------
      - name: Commit and push updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add rag_artifacts/

          if git diff --cached --quiet; then
            echo "No changes to rag_artifacts/, skipping commit"
          else
            git commit -m "chore(rag): rebuild index [skip ci]"
            git push
          fi
